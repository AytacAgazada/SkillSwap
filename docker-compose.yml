services:
  # INFRASTRUCTURE
  eureka-server:
    build: ./EurekaService
    ports:
      - "8761:8761"
    networks:
      - skillswap-net

  postgres:
    image: postgres:13.2
    environment:
      POSTGRES_DB: community_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Avoid port conflict with local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillswap-net

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongo_data:/data/db
    networks:
      - skillswap-net

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret123
      ME_CONFIG_MONGODB_SERVER: mongodb
    depends_on:
      - mongodb
    networks:
      - skillswap-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    ports:
      - "2181:2181"
    networks:
      - skillswap-net

  broker:
    image: confluentinc/cp-kafka:7.5.3
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - skillswap-net

  es01:
    image: elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - skillswap-net

  kibana:
    image: kibana:8.10.2
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
    depends_on:
      - es01
    networks:
      - skillswap-net

  # MICROSERVICES
  auth-service:
    build: ./authService
    ports:
      - "7008:1111"
    depends_on:
      - eureka-server
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1111
    networks:
      - skillswap-net

  chat-service:
    build: ./ChatService
    ports:
      - "7007:1113"
    depends_on:
      - eureka-server
      - mongodb
    environment:
      - SPRING_APPLICATION_NAME=chat-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/skillswap-chat
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1113
    networks:
      - skillswap-net

  community-service:
    build: ./CommunityService
    ports:
      - "7006:1114"
    depends_on:
      - eureka-server
      - postgres
    environment:
      - SPRING_APPLICATION_NAME=community-service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/community_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1114
    networks:
      - skillswap-net

  gamification-service:
    build: ./GamificationService
    ports:
      - "7005:1111"
    depends_on:
      - eureka-server
      - mongodb
    environment:
      - SPRING_APPLICATION_NAME=gamification-service
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/skillswap-gamification
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1111
    networks:
      - skillswap-net

  notification-service:
    build: ./NotificationService
    ports:
      - "7004:1116"
    depends_on:
      - eureka-server
      - broker
    environment:
      - SPRING_APPLICATION_NAME=notification-service
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1116
    networks:
      - skillswap-net

  skill-swap-service:
    build: ./SkillSwapService
    ports:
      - "7003:1112"
    depends_on:
      - eureka-server
      - es01
    environment:
      - SPRING_APPLICATION_NAME=skill-swap-service
      - SPRING_ELASTICSEARCH_URIS=http://es01:9200
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1112
    networks:
      - skillswap-net

  skill-user-service:
    build: ./SkillUserService
    ports:
      - "7002:1117"
    depends_on:
      - eureka-server
    environment:
      - SPRING_APPLICATION_NAME=skill-user-service
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=1117
    networks:
      - skillswap-net
  
  api-gateway:
    build: ./ApiGateway
    ports:
      - "7001:8080"
    depends_on:
      - eureka-server
    environment:
      - SPRING_APPLICATION_NAME=api-gateway
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka
      - SERVER_PORT=8080
    networks:
      - skillswap-net

networks:
  skillswap-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  elasticsearch-data:
